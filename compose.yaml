services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: santa
      POSTGRES_USER: santa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa"]
      interval: 5s
      retries: 10
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://santa:${POSTGRES_PASSWORD}@db:5432/santa
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
