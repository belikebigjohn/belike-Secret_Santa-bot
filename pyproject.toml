[project]
name = "secret-santa-bot"
version = "0.1.0"
requires-python = ">=3.11,<3.16"
dependencies = [
  "aiogram>=3.32,<4",
  "SQLAlchemy>=2.0.58,<2.2",
  "psycopg[binary]>=3.2,<4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
secret-santa = "santa.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["santa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
