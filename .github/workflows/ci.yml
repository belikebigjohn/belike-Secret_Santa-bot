name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Validate Compose and build container
        run: |
          printf 'BOT_TOKEN=123456:CI\nOWNER_IDS=1\nPOSTGRES_PASSWORD=ci_password\n' > .env
          docker compose config --quiet
          docker build -t secret-santa:ci .
